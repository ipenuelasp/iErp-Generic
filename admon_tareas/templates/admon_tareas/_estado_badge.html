{% if estado == 'COMP' %}<span class="inline-flex items-center gap-1 text-[10px] font-black uppercase px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-600">{{ display }}</span>
{% elif estado == 'PROC' %}<span class="inline-flex items-center gap-1 text-[10px] font-black uppercase px-2 py-0.5 rounded-full bg-blue-50 text-blue-600">{{ display }}</span>
{% elif estado == 'BLOQ' %}<span class="inline-flex items-center gap-1 text-[10px] font-black uppercase px-2 py-0.5 rounded-full bg-rose-50 text-rose-600">{{ display }}</span>
{% elif estado == 'REVI' %}<span class="inline-flex items-center gap-1 text-[10px] font-black uppercase px-2 py-0.5 rounded-full bg-amber-50 text-amber-600">{{ display }}</span>
{% elif estado == 'CANC' %}<span class="inline-flex items-center gap-1 text-[10px] font-black uppercase px-2 py-0.5 rounded-full bg-slate-100 text-slate-400 line-through">{{ display }}</span>
{% else %}<span class="inline-flex items-center gap-1 text-[10px] font-black uppercase px-2 py-0.5 rounded-full bg-slate-100 text-slate-500">{{ display }}</span>{% endif %}
